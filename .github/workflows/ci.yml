name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: 六道闸门 + 全量测试 (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: mvn verify（格式 / Checkstyle / PMD / JaCoCo / Enforcer / ArchUnit / 测试）
        run: ./mvnw -B --no-transfer-progress verify

      # 跨章回归不变式：35 个章节模块是同一份代码的快照，第 K 章的修复必须传到 K+1、K+2。
      # 这一条不属于任何单个模块（要横着比），所以放在 CI 里单独跑，见 scripts/check-propagation.sh。
      - name: 跨章回归不变式（propagation）
        run: bash scripts/check-propagation.sh

      # 文档腐败防线：文件改名后链接不跟着改，不会让任何测试变红，只会让读者撞 404。
      - name: 文档相对链接可达性
        run: bash scripts/check-doc-links.sh

      - name: 上传测试与覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-jdk${{ matrix.java }}
          path: |
            **/target/surefire-reports/**
            **/target/site/jacoco/**
          retention-days: 7
          if-no-files-found: ignore
