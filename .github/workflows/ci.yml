name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: 六道闸门 + 全量测试 (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: mvn verify（格式 / Checkstyle / PMD / JaCoCo / Enforcer / ArchUnit / 测试）
        run: ./mvnw -B --no-transfer-progress verify

      - name: 脚本自检（--help 可跑，防止改坏参数解析）
        run: |
          bash scripts/check-propagation.sh --help > /dev/null
          bash scripts/propagate.sh --help > /dev/null

      # 跨章回归不变式：35 个章节模块是同一份代码的快照，第 K 章的修复必须传到 K+1、K+2。
      # 这一条不属于任何单个模块（要横着比），所以放在 CI 里单独跑，见 scripts/check-propagation.sh。
      - name: 第 7 道闸门 · 跨章回归不变式
        run: bash scripts/check-propagation.sh

      # 文档腐败防线之一：文件改名后链接不跟着改，不会让任何测试变红，只会让读者撞 404。
      - name: 第 9 道闸门 · 文档相对链接可达性
        run: bash scripts/check-doc-links.sh

      - name: 第 10 道闸门 · 章节交叉引用的主题校验
        run: python3 scripts/check-chapter-refs.py

      # 体量表是手抄的，代码会变：抄错一个数字不影响编译，只影响读者对全书体量的判断。
      - name: 第 11 道闸门 · 章节体量表数字
        run: python3 scripts/check-doc-tables.py

      # 35 篇评审是分四批写的，判决行曾有三种写法；想横向比较就得先读懂三种语法。
      - name: 第 12 道闸门 · 评审文档判决行格式
        run: python3 scripts/check-review-format.py

      - name: 上传测试与覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-jdk${{ matrix.java }}
          path: |
            **/target/surefire-reports/**
            **/target/site/jacoco/**
          retention-days: 7
          if-no-files-found: ignore

  doc-refs:
    name: 第 8 道闸门 · 文档引用可验证性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 只为了比对「出处：...java:123」这类上游引用；拿不到就降级：
      # 脚本会打 INFO 跳过上游引用，本地引用照常检查。
      - name: 取上游 Spring 6.2.x 源码树
        continue-on-error: true
        run: git clone --depth 1 --branch 6.2.x https://github.com/spring-projects/spring-framework.git .spring-ref

      - name: 文档引用可验证性（javadoc 的 {@code X}、正文的 File.java:行、栈帧）
        env:
          SPRING_REF: ${{ github.workspace }}/.spring-ref
        run: bash scripts/check-doc-refs.sh --all

      # 第 13 道闸门要解析「上游类名:行号」，所以跟着这一份上游源码走；
      # 没有上游时脚本降级为 WARN（只查本仓引用），不误报。
      - name: 第 13 道闸门 · 评审文档的引用可解析
        env:
          SPRING_REF: ${{ github.workspace }}/.spring-ref
        run: python3 scripts/check-review-refs.py
